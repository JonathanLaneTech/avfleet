<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AV Fleet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark" id="mark" aria-hidden="true"></span>
    <img class="logo" id="logo" alt="" hidden>
    <h1 id="title">AV Fleet</h1>
  </div>
  <div class="summary" id="summary" aria-live="polite"></div>
  <div class="claude" id="claude" hidden></div>
  <div class="stamp" id="stamp">connecting…</div>
</header>
<main>
  <section id="groups" aria-label="Devices"></section>
  <section class="log" aria-label="Event log">
    <h2><button type="button" id="log-toggle" class="log-toggle" aria-expanded="true" aria-controls="events">
      <span class="chev" aria-hidden="true"></span>Event log <span id="log-count" class="log-count"></span>
    </button></h2>
    <div class="filters" role="group" aria-label="Filter events">
      <button data-kind="all" class="on">All</button>
      <button data-kind="alert">Alerts</button>
      <button data-kind="action">Actions</button>
      <button data-kind="maintenance">Maintenance</button>
      <button data-kind="claude">Claude</button>
      <button data-kind="state">State changes</button>
    </div>
    <ol id="events"></ol>
    <div id="log-more" class="log-more"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
